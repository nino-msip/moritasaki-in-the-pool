<style>

  :root {
    --ink-ground: #0d0d0d; --ink-ground-raised: #171717;
    --paper: #f5f4f2; --paper-line: #dedcd7;
    --line-dark: #2c2c2c;
    --white: #ffffff; --black: #0d0d0d;
    --red: #e62429; --red-dark: #a60000; --gold: #e8b63e;
    --ink-dim-onblack: #9a9a9a; --ink-dim-onwhite: #5c5c5c;
    --nav-h: 68px; font-size: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--black);
    font-family: 'Roboto', 'Noto Sans JP', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--red); color: #fff; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  .impact { font-family: 'Anton', 'Noto Sans JP', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }

  .clip-btn {
    clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--red); color: #fff; font-family: 'Roboto Condensed', sans-serif;
    font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 13px 26px 13px 30px; white-space: nowrap; transition: background 0.15s ease;
  }
  .clip-btn:hover { background: var(--red-dark); }

  nav { position: sticky; top: 0; z-index: 50; height: var(--nav-h); background: var(--ink-ground);
    display: flex; align-items: center; gap: clamp(16px, 2.4vw, 32px);
    padding: 0 clamp(20px, 4vw, 56px); border-bottom: 3px solid var(--red);
    overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .nav-mark { display: flex; align-items: center; margin-right: 6px; flex-shrink: 0; }
  .nav-mark img { height: 28px; width: auto; }
  nav a.tab { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; font-size: 12.5px;
    letter-spacing: 0.1em; text-transform: uppercase; color: #cfcfcf;
    white-space: nowrap; padding: 4px 2px; border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease; }
  nav a.tab:hover, nav a.tab.active { color: #fff; border-color: var(--red); }
  nav a.tab:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
  .nav-ver { margin-left: auto; font-size: 10.5px; color: #5a5a5a; white-space: nowrap; }

  .hero { background: var(--ink-ground); color: #fff;
    padding: clamp(56px, 10vw, 108px) clamp(20px, 4vw, 56px) clamp(72px, 10vw, 120px);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 40px), 0 100%);
    margin-bottom: -40px; position: relative; z-index: 1; }
  .hero-logo { max-width: 560px; width: 100%; height: auto; margin-bottom: 36px; }
  .eyebrow { font-family: 'Roboto Condensed', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--red); margin: 0 0 14px; }
  h1.headline { font-family: 'Anton', 'Noto Sans JP', sans-serif;
    font-weight: 400; font-size: clamp(30px, 4.4vw, 50px); line-height: 1.05; margin: 0 0 24px; text-wrap: balance; max-width: 20ch; }

  .inst-list { list-style: none; margin: 0; padding: 0; max-width: 680px; }
  .inst-list li { display: flex; gap: 18px; padding: 18px 0; border-top: 1px solid #2a2a2a; }
  .inst-num { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 22px; color: var(--red); flex-shrink: 0; width: 32px; }
  .inst-en { font-size: 14.5px; color: #f0f0f0; line-height: 1.6; }
  .inst-ja { font-size: 12.5px; color: #9a9a9a; margin-top: 5px; line-height: 1.65; }

  main { min-height: calc(100vh - var(--nav-h) - 200px); position: relative; z-index: 2; background: var(--paper); }
  section { padding: clamp(56px, 8vw, 96px) clamp(20px, 4vw, 56px) clamp(40px, 7vw, 72px); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: clamp(28px, 4vw, 40px); }
  h2.section-title { margin: 0; font-family: 'Anton', 'Noto Sans JP', sans-serif; font-weight: 400;
    text-transform: uppercase; font-size: clamp(26px, 3.6vw, 36px); position: relative; padding-bottom: 14px; }
  h2.section-title::after { content: ""; position: absolute; left: 0; bottom: 0; width: 56px; height: 4px; background: var(--red); }
  .section-count { font-family: 'Roboto Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-dim-onwhite); font-variant-numeric: tabular-nums; }

  /* comic-grid cards: Music / Goods / MV */
  /* ── Setlist Tool (静止プレビュー) ── */
  .sl-field-label { font-family: 'Roboto Condensed', sans-serif; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-dim-onwhite); margin-bottom: 6px; display: block; }
  .sl-meta-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  .sl-input { background: #fff; border: 1px solid var(--paper-line); color: var(--black);
    padding: 10px 14px; font-size: 14px; font-family: 'Roboto', sans-serif; min-width: 160px; }
  .sl-input-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .sl-input-row .sl-input { flex: 1; min-width: 220px; }
  .sl-btn { font-family: 'Roboto Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 11px 22px; border: none; background: var(--ink-ground); color: #fff; }
  .sl-btn.secondary { background: transparent; color: var(--black); border: 1px solid var(--paper-line); }
  .sl-song-list { list-style: none; margin: 0 0 24px; padding: 0; }
  .sl-song-list li { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border: 1px solid var(--paper-line); margin-bottom: 3px; font-size: 14px; background: #fff; }
  .sl-song-list .num { color: var(--ink-dim-onwhite); font-size: 12px; min-width: 24px; }
  .sl-song-list .dur { margin-left: auto; color: var(--ink-dim-onwhite); font-size: 11px; }
  .sl-generate-row { display: flex; gap: 10px; margin-bottom: 40px; }
  .sl-tabs { display: flex; gap: 4px; border-bottom: 3px solid var(--ink-ground); margin-bottom: 20px; }
  .sl-tab { font-family: 'Roboto Condensed', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase;
    padding: 10px 20px; color: var(--ink-dim-onwhite); }
  .sl-tab.active { color: var(--red); }
  .sl-sheet { background: #fff; color: #111; padding: 20px; overflow-x: auto; border: 1px solid var(--paper-line); }
  .sl-sheet table { border-collapse: collapse; width: 100%; font-size: 12px; min-width: 560px; }
  .sl-sheet th { background: #f3f3f3; padding: 8px 10px; border: 1px solid #ccc; text-align: center; font-weight: 600; }
  .sl-sheet td { padding: 8px 10px; border: 1px solid #ddd; text-align: center; vertical-align: middle; }
  .sl-sheet td.left { text-align: left; white-space: pre-line; }

  .comic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: clamp(18px, 2.6vw, 28px); }
  .comic-card { display: flex; flex-direction: column; }
  .comic-cover { width: 100%; aspect-ratio: 3 / 4; background: var(--ink-ground); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 20px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: transform 0.15s ease; }
  .comic-card:hover .comic-cover { transform: translateY(-3px); }
  .comic-icon { width: 44px; height: 44px; color: #fff; }
  .comic-icon svg, .comic-icon img { width: 100%; height: 100%; }
  .comic-cover.mv-cover { padding: 0; aspect-ratio: 16 / 9; }
  .comic-cover.mv-cover img.mv-thumb { width: 100%; height: 100%; object-fit: cover; }
  .comic-title { margin-top: 12px; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 15px;
    line-height: 1.2; }

  /* Schedule: angular tag rows */
  .story-list { display: flex; flex-direction: column; }
  .story-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; align-items: center;
    padding: 24px 0; border-bottom: 1px solid var(--paper-line); }
  .story-row:first-child { padding-top: 0; }
  .story-tag { display: inline-block; background: var(--red); color: #fff; font-family: 'Roboto Condensed', sans-serif;
    font-weight: 700; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px 3px 12px;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); margin-bottom: 8px; }
  .story-date { font-family: 'Roboto Condensed', sans-serif; font-size: 12px; font-weight: 700; color: var(--ink-dim-onwhite);
    letter-spacing: 0.04em; margin-left: 8px; }
  .story-title { font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(18px, 2vw, 22px); line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
  .story-venue { font-size: 13.5px; color: var(--black); }
  .story-city { color: var(--ink-dim-onwhite); }
  .story-performers { font-size: 12.5px; color: var(--ink-dim-onwhite); margin-top: 4px; }

  /* Members */
  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px; background: var(--paper-line); }
  .member-plate { background: var(--white); padding: 26px 22px; display: flex; flex-direction: column; gap: 10px; }
  .member-role { font-family: 'Roboto Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--red); }
  .member-name { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 22px; }
  .member-links { display: flex; gap: 10px; margin-top: 6px; }
  .member-links a { width: 30px; height: 30px; display: grid; place-items: center; background: var(--ink-ground);
    color: #fff; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); transition: background 0.15s ease; }
  .member-links a svg { width: 13px; height: 13px; }
  .member-links a:hover { background: var(--red); }

  .contact-block { margin-top: clamp(40px, 6vw, 64px); }
  .contact-links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .contact-links a { display: inline-flex; align-items: center; gap: 12px; font-size: 14.5px; color: var(--black); width: fit-content; }
  .contact-links a svg { width: 17px; height: 17px; color: var(--ink-dim-onwhite); }
  .contact-links a:hover svg { color: var(--red); }
  .contact-mail { font-size: 13px; color: var(--ink-dim-onwhite); }
  .contact-mail a { color: var(--black); border-bottom: 1px solid var(--paper-line); }

  .note-row { display: inline-flex; align-items: center; gap: 18px; background: var(--ink-ground); padding: 22px 28px;
    clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
  .note-row img.note-icon { width: 26px; height: 26px; }
  .note-mark { font-family: 'Anton', sans-serif; font-size: 20px; color: #fff; }

  .page-nav { display: flex; justify-content: space-between; padding: 24px clamp(20px, 4vw, 56px);
    font-family: 'Roboto Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .page-nav a { color: var(--ink-dim-onwhite); }
  .page-nav a:hover { color: var(--red); }

  footer { padding: 36px clamp(20px, 4vw, 56px) 48px; background: var(--ink-ground);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .footer-mark img { height: 22px; width: auto; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
  .footer-links a { font-family: 'Roboto Condensed', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: #9a9a9a; }
  .footer-links a:hover { color: #fff; }

  .note-strip { padding: 14px clamp(20px, 4vw, 56px); background: var(--red-dark); color: #ffd9d9;
    font-size: 12px; line-height: 1.7; }
  .note-strip b { color: #fff; }

  @media (prefers-reduced-motion: reduce) { nav a, .comic-cover, .clip-btn { transition: none; } }


  :root[data-theme="light"] {

  }
  :root[data-theme="light"] nav { border-bottom: 1px solid var(--paper-line); }
  :root[data-theme="light"] nav a.tab { color: #7a7a7a; }
  :root[data-theme="light"] nav a.tab:hover,
  :root[data-theme="light"] nav a.tab.active { color: var(--black); }
  :root[data-theme="light"] .nav-ver { color: #9a9690; }
  :root[data-theme="light"] .hero-content { color: var(--black) !important; border-bottom: 1px solid var(--paper-line); }
  :root[data-theme="light"] .inst-en { color: #1a1a1a; }
  :root[data-theme="light"] .inst-ja { color: #5c5c5c; }
  :root[data-theme="light"] .inst-list li { border-top-color: #ddd8cf; }
  :root[data-theme="light"] .comic-icon { color: var(--black); }
  :root[data-theme="light"] .comic-cover { border: 1px solid var(--paper-line); }
  :root[data-theme="light"] .member-links a { color: var(--black); border: 1px solid var(--paper-line); }
  :root[data-theme="light"] .sl-btn { color: var(--black); border: 1px solid var(--paper-line); }
  :root[data-theme="light"] .note-mark { color: var(--black); }
  :root[data-theme="light"] .footer-links a { color: #9a9690; }
  :root[data-theme="light"] .footer-links a:hover { color: var(--black); }


  .theme-toggle { margin-left: 12px; width: 30px; height: 30px; flex-shrink: 0;
    display: grid; place-items: center; border: 1px solid var(--tgl-border, currentColor);
    background: transparent; color: inherit; cursor: pointer; font-size: 14px;
    border-radius: 50%; opacity: 0.75; transition: opacity 0.15s ease; }
  .theme-toggle:hover { opacity: 1; }

</style>

  function current(){ return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  document.querySelectorAll('.theme-toggle').forEach(function(btn){
    function sync(){ btn.textContent = current() === 'light' ? '\u263E' : '\u2600'; }
    sync();
    btn.addEventListener('click', function(){
      var next = current() === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try{ localStorage.setItem('mvsp-dr-theme', next); }catch(e){}
      document.querySelectorAll('.theme-toggle').forEach(sync);
    });
  });
})();</script>
</body>
</html>
