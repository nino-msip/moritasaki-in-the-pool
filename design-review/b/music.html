<style>

  :root {
    --paper: #0a0906; --paper-raised: #161310;
    --line: #2c2822; --ink: #f6f3ea; --ink-dim: #938c7c;
    --card: #121009; --card-line: #2c2822;
    --maroon: #a10e12; --red: #e5151b; --navy: #1b1310;
    --nav-h: 76px; font-size: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Public Sans', 'Noto Sans JP', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--maroon); color: #fff; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  .serif { font-family: Georgia, 'Noto Serif JP', serif; }

  .top-rule { height: 5px; background: var(--maroon); }

  nav { height: var(--nav-h); display: flex; align-items: center; gap: clamp(20px, 3vw, 40px);
    padding: 0 clamp(20px, 4vw, 56px); border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .nav-mark { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
  .nav-mark img { height: 30px; width: auto; }
  nav a.tab { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-dim); white-space: nowrap; padding: 4px 0; border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease; }
  nav a.tab:hover, nav a.tab.active { color: var(--ink); border-color: var(--red); }
  nav a.tab:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
  .nav-ver { margin-left: auto; font-size: 11px; color: #a29c8d; white-space: nowrap; }

  .ticker { display: flex; align-items: center; gap: 18px; padding: 12px clamp(20px, 4vw, 56px);
    border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 0.08em; }
  .ticker-mark { font-weight: 700; color: var(--red); flex-shrink: 0; }
  .ticker-sep { color: var(--line); }
  .ticker-item { color: var(--ink-dim); text-transform: uppercase; }

  .hero { padding: clamp(40px, 7vw, 72px) clamp(20px, 4vw, 56px) clamp(48px, 7vw, 80px); border-bottom: 1px solid var(--line); }
  .hero-logo { max-width: 520px; width: 100%; height: auto; margin-bottom: 36px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--red); margin: 0 0 14px; }
  h1.headline { font-family: Georgia, 'Noto Serif JP', serif; font-weight: 700; font-size: clamp(28px, 3.6vw, 42px);
    line-height: 1.18; margin: 0 0 10px; text-wrap: balance; max-width: 22ch; }
  .dek { font-size: 14px; color: var(--ink-dim); max-width: 52ch; line-height: 1.75; margin: 0 0 32px; }

  .inst-list { list-style: none; margin: 0; padding: 0; max-width: 680px; }
  .inst-list li { display: flex; gap: 20px; padding: 20px 0; border-top: 1px solid var(--line); }
  .inst-num { font-family: Georgia, serif; font-weight: 700; font-size: 20px; color: var(--red); flex-shrink: 0; width: 28px; }
  .inst-en { font-size: 15px; color: var(--ink); line-height: 1.6; }
  .inst-ja { font-size: 12.5px; color: var(--ink-dim); margin-top: 5px; line-height: 1.65; }

  main { min-height: calc(100vh - var(--nav-h) - 220px); }
  section { padding: clamp(40px, 7vw, 72px) clamp(20px, 4vw, 56px); border-bottom: 1px solid var(--line); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
    margin-bottom: clamp(24px, 3.6vw, 36px); border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
  h2.section-title { margin: 0; font-family: Georgia, 'Noto Serif JP', serif; font-weight: 700;
    font-size: clamp(22px, 3vw, 30px); }
  .section-count { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

  /* editorial list (Schedule) */
  .story-list { display: flex; flex-direction: column; }
  .story-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; align-items: start;
    padding: 26px 0; border-bottom: 1px solid var(--line); }
  .story-row:first-child { padding-top: 0; }
  .story-meta-row { display: flex; gap: 10px; align-items: center; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
  .story-tag { color: var(--red); font-weight: 700; }
  .story-title { font-family: Georgia, 'Noto Serif JP', serif; font-weight: 700; font-size: clamp(18px, 2vw, 22px);
    line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
  .story-venue { font-size: 13.5px; color: var(--ink); }
  .story-city { color: var(--ink-dim); }
  .story-performers { font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; border: 1.5px solid var(--ink); border-radius: 999px; padding: 10px 22px;
    white-space: nowrap; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
  .pill:hover { background: var(--red); border-color: var(--red); color: #0a0906; }

  /* Members */
  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--card-line); }
  .member-plate { background: var(--card); padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--card-line); }
  .member-role { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--red); }
  .member-name { font-family: Georgia, 'Noto Serif JP', serif; font-weight: 700; font-size: 21px; }
  .member-links { display: flex; gap: 10px; margin-top: 6px; }
  .member-links a { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line);
    border-radius: 50%; color: var(--ink-dim); transition: border-color 0.15s ease, color 0.15s ease; }
  .member-links a svg { width: 13px; height: 13px; }
  .member-links a:hover { border-color: var(--maroon); color: var(--maroon); }

  .contact-block { margin-top: clamp(36px, 5vw, 56px); }
  .contact-links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .contact-links a { display: inline-flex; align-items: center; gap: 12px; font-size: 14.5px; color: var(--ink); width: fit-content; }
  .contact-links a svg { width: 17px; height: 17px; color: var(--ink-dim); }
  .contact-links a:hover svg { color: var(--maroon); }
  .contact-mail { font-size: 13px; color: var(--ink-dim); }
  .contact-mail a { color: var(--ink); border-bottom: 1px solid var(--line); }

  /* Music / Goods */
  .link-row { display: flex; flex-direction: column; }
  .mv-row-list { display: flex; flex-direction: column; }
  .mv-row { display: flex; align-items: center; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .mv-row:first-child { padding-top: 0; }

  .mv-row-title { font-family: Georgia, 'Noto Serif JP', serif; font-weight: 700; font-size: 17px; flex: 1; }

  /* ── Setlist Tool (静止プレビュー) ── */

  .sl-btn.primary { background: var(--ink); color: var(--paper); }

    border-bottom: 1px solid var(--line); font-size: 14px; }
  .sl-song-list .num { color: var(--ink-dim); font-size: 12px; min-width: 24px; }
  .sl-song-list .dur { margin-left: auto; color: var(--ink-dim); font-size: 11px; }
  .sl-generate-row { display: flex; gap: 10px; margin-bottom: 40px; }
  .sl-tabs { display: flex; gap: 20px; border-bottom: 2px solid var(--ink); margin-bottom: 20px; padding-bottom: 10px; }
  .sl-tab { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); }
  .sl-tab.active { color: var(--maroon); font-weight: 700; }
  .sl-sheet { background: #fff; color: #111; padding: 20px; overflow-x: auto; border: 1px solid var(--line); }
  .sl-sheet table { border-collapse: collapse; width: 100%; font-size: 12px; min-width: 560px; }
  .sl-sheet th { background: #f3f3f3; padding: 8px 10px; border: 1px solid #ccc; text-align: center; font-weight: 600; }
  .sl-sheet td { padding: 8px 10px; border: 1px solid #ddd; text-align: center; vertical-align: middle; }
  .sl-sheet td.left { text-align: left; white-space: pre-line; }

  .link-item { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 0; border-bottom: 1px solid var(--line); }
  .link-item:first-child { padding-top: 0; }
  .link-id { display: flex; align-items: center; gap: 14px; }
  .link-icon { width: 22px; height: 22px; color: var(--ink); flex-shrink: 0; }
  .link-icon svg, .link-icon img { width: 100%; height: 100%; }
  .link-label { font-family: Georgia, 'Noto Serif JP', serif; font-weight: 700; font-size: 17px; }

  .note-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 420px;
    padding: 22px 26px; border: 1px solid var(--ink); }
  .note-mark { font-family: Georgia, serif; font-weight: 700; font-style: italic; font-size: 20px; }
  .note-row img.note-icon { width: 26px; height: 26px; flex-shrink: 0; }
  .note-row .note-id { display: flex; align-items: center; gap: 12px; }

  .page-nav { display: flex; justify-content: space-between; padding: 24px clamp(20px, 4vw, 56px);

  .page-nav a { color: var(--ink-dim); }
  .page-nav a:hover { color: var(--maroon); }

  .footer-mark img { height: 22px; width: auto; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
  .footer-links a { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
  .footer-links a:hover { color: var(--maroon); }

  .note-strip { padding: 14px clamp(20px, 4vw, 56px); background: var(--navy); color: #cfc9bb; border-bottom: 1px solid var(--line);
    font-size: 12px; line-height: 1.7; }
  .note-strip b { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { nav a, .pill { transition: none; } }

  .theme-toggle:hover { opacity: 1; }

</style>

<script>(function(){
  var root = document.documentElement;
  function current(){ return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  document.querySelectorAll('.theme-toggle').forEach(function(btn){
    function sync(){ btn.textContent = current() === 'light' ? '\u263E' : '\u2600'; }
    sync();
    btn.addEventListener('click', function(){
      var next = current() === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try{ localStorage.setItem('mvsp-dr-theme', next); }catch(e){}
      document.querySelectorAll('.theme-toggle').forEach(sync);
    });
  });
})();</script>
