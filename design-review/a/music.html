<style>

  :root {
    --ground: #040302; --ground-raised: #111;
    --line: #262523; --ink: #f4f2ec; --ink-dim: #8f8b83;
    --card: #ffffff; --card-ink: #0a0a0a; --card-dim: #6b675f;
    --accent: #e71119; --accent-ink: #ffffff;
    --nav-h: 64px; font-size: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Roboto', system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  nav { position: sticky; top: 0; z-index: 50; height: var(--nav-h);
    display: flex; align-items: center; gap: clamp(16px, 2.6vw, 36px);
    padding: 0 clamp(20px, 4vw, 56px); background: rgba(4, 3, 2, 0.9);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .nav-mark { display: flex; align-items: center; margin-right: 8px; flex-shrink: 0; }
  .nav-mark img { height: 26px; width: auto; }
  nav a { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 12.5px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim);
    white-space: nowrap; padding: 4px 0; border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease; }
  nav a:hover, nav a.active { color: var(--ink); border-color: var(--accent); }
  nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .nav-ver { margin-left: auto; font-size: 11px; color: #4a4844; white-space: nowrap; }

  .hero { padding: clamp(56px, 10vw, 108px) clamp(20px, 4vw, 56px) clamp(56px, 8vw, 96px);
    border-bottom: 1px solid var(--line); }
  .hero-logo { max-width: 620px; width: 100%; height: auto; margin-bottom: 40px; }
  .instructions-label { font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: 0.32em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  .instructions-sub { font-size: 13px; color: var(--ink-dim); margin: 0 0 28px; max-width: 46ch; line-height: 1.7; }
  .instructions-list { list-style: none; margin: 0; padding: 0; max-width: 640px; counter-reset: inst; }
  .instructions-list li { counter-increment: inst; display: flex; gap: 18px; padding: 18px 0; border-top: 1px solid var(--line); }
  .instructions-list li::before { content: "0" counter(inst); font-family: 'Oswald', sans-serif; font-weight: 600;
    font-size: 13px; color: var(--accent); flex-shrink: 0; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .inst-en { font-size: 14.5px; color: var(--ink); line-height: 1.6; }
  .inst-ja { font-size: 13px; color: var(--ink-dim); margin-top: 4px; line-height: 1.6; }

  main { min-height: calc(100vh - var(--nav-h) - 160px); }
  section { padding: clamp(48px, 8vw, 88px) clamp(20px, 4vw, 56px); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
    margin-bottom: clamp(28px, 4vw, 44px); flex-wrap: wrap; }
  h2.section-title { margin: 0; font-family: 'Oswald', sans-serif; font-weight: 600;
    font-size: clamp(28px, 4.4vw, 44px); text-transform: uppercase; letter-spacing: 0.01em; }
  .section-count { font-size: 12px; letter-spacing: 0.06em; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: clamp(20px, 3vw, 32px); }
  .show-card { display: flex; flex-direction: column; }
  .show-plate { background: var(--card); color: var(--card-ink); aspect-ratio: 4 / 3; padding: 22px;
    display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .show-plate::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--accent); }
  .show-num { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em;
    color: #c2beb2; font-variant-numeric: tabular-nums; }
  .show-plate-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: clamp(19px, 2.2vw, 23px);
    line-height: 1.2; text-wrap: balance; }
  .show-meta { margin-top: 14px; display: flex; flex-direction: column; gap: 3px; }
  .show-date { font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.03em; color: var(--ink); }
  .show-venue { font-size: 13px; color: var(--ink-dim); }
  .show-city { color: #5c5952; }
  .show-performers { font-size: 12px; color: #5c5952; margin-top: 2px; }
  .show-tickets { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .ticket-pill { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink); border: 1px solid #3a3834; padding: 7px 15px;
    transition: border-color 0.15s ease, color 0.15s ease; }
  .ticket-pill:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Setlist Tool (静止プレビュー) ── */
  .sl-field-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; display: block; }
  .sl-meta-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  .sl-input, .sl-select { background: var(--ground-raised); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 14px; font-size: 14px; font-family: 'Roboto', sans-serif; min-width: 160px; }
  .sl-input-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .sl-input-row .sl-input { flex: 1; min-width: 220px; }
  .sl-btn { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 10px 22px; background: #fff; color: #000; border: none; }
  .sl-btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .sl-song-list { list-style: none; margin: 0 0 24px; padding: 0; }
  .sl-song-list li { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border: 1px solid var(--line); margin-bottom: 3px; font-size: 14px; }
  .sl-song-list .num { color: var(--ink-dim); font-size: 12px; min-width: 24px; }
  .sl-song-list .dur { margin-left: auto; color: #555; font-size: 11px; }
  .sl-generate-row { display: flex; gap: 10px; margin-bottom: 40px; }
  .sl-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .sl-tab { font-size: 12px; padding: 10px 20px; color: var(--ink-dim); border: 1px solid var(--line); border-bottom: none; }
  .sl-tab.active { color: #fff; border-color: #fff; }
  .sl-sheet { background: #fff; color: #111; padding: 20px; overflow-x: auto; }
  .sl-sheet table { border-collapse: collapse; width: 100%; font-size: 12px; min-width: 560px; }
  .sl-sheet th { background: #f3f3f3; padding: 8px 10px; border: 1px solid #ccc; text-align: center; font-weight: 600; }
  .sl-sheet td { padding: 8px 10px; border: 1px solid #ddd; text-align: center; vertical-align: middle; }
  .sl-sheet td.left { text-align: left; white-space: pre-line; }

  .mv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: clamp(20px, 3vw, 32px); }
  .mv-card { display: flex; flex-direction: column; }
  .mv-thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; border: 1px solid var(--line); transition: border-color 0.15s ease; }
  .mv-card:hover .mv-thumb { border-color: var(--accent); }
  .mv-title { margin-top: 12px; font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }

  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: clamp(16px, 2.4vw, 24px); }
  .member-plate { background: var(--card); color: var(--card-ink); padding: 26px 22px; display: flex; flex-direction: column; gap: 12px; }
  .member-role { font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--accent); }
  .member-name { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 21px; letter-spacing: 0.01em; }
  .member-links { display: flex; gap: 12px; margin-top: 4px; }
  .member-links a { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #d7d3c8;
    border-radius: 50%; color: #57534a; transition: border-color 0.15s ease, color 0.15s ease; }
  .member-links a svg { width: 14px; height: 14px; }
  .member-links a:hover { border-color: var(--accent); color: var(--accent); }

  .contact-block { margin-top: clamp(40px, 6vw, 64px); }
  .contact-links { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .contact-links a { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; color: var(--ink); width: fit-content; }
  .contact-links a svg { width: 18px; height: 18px; color: var(--ink-dim); }
  .contact-links a:hover svg { color: var(--accent); }
  .contact-mail { font-size: 13.5px; color: var(--ink-dim); }
  .contact-mail a { color: var(--ink); border-bottom: 1px solid var(--line); }

  .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: clamp(14px, 2vw, 20px); }
  .music-plate { background: var(--card); color: var(--card-ink); padding: 22px; display: flex; align-items: center;
    gap: 14px; transition: transform 0.15s ease; }
  .music-plate:hover { transform: translateY(-2px); }
  .music-icon { width: 26px; height: 26px; flex-shrink: 0; color: var(--card-ink); }
  .music-icon svg { width: 100%; height: 100%; }
  .music-label { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.01em; }
  .music-plate.goods-plate { align-items: flex-start; flex-direction: column; gap: 10px; }
  .music-plate.goods-plate img { width: 32px; height: 32px; }

  .note-plate { display: inline-flex; align-items: center; gap: 16px; background: var(--card); color: var(--card-ink); padding: 20px 28px; }
  .note-plate img.note-icon { width: 28px; height: 28px; flex-shrink: 0; }
  .note-plate .note-mark { font-family: 'Oswald', sans-serif; font-weight: 700; font-style: italic; font-size: 22px; }
  .note-plate .note-arrow { color: var(--accent); font-family: 'Oswald', sans-serif; font-weight: 600; }

  .page-nav { display: flex; justify-content: space-between; padding: 28px clamp(20px, 4vw, 56px);
    border-top: 1px solid var(--line); }
  .page-nav a { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-dim); }
  .page-nav a:hover { color: var(--accent); }

  footer { padding: 40px clamp(20px, 4vw, 56px) 56px; display: flex; justify-content: space-between;
    align-items: flex-end; gap: 24px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .footer-mark img { height: 24px; width: auto; }
  .footer-links { display: flex; gap: 22px; flex-wrap: wrap; }
  .footer-links a { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
  .footer-links a:hover { color: var(--ink); }

  .note-strip { padding: 16px clamp(20px, 4vw, 56px); background: var(--ground-raised); font-size: 12px;
    color: var(--ink-dim); line-height: 1.7; border-bottom: 1px solid var(--line); }
  .note-strip b { color: var(--ink); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) { nav a, .music-plate { transition: none; } }


  :root[data-theme="light"] {

  }

  :root[data-theme="light"] .ticket-pill { border-color: #cdc3ac; }


  .theme-toggle { margin-left: 12px; width: 30px; height: 30px; flex-shrink: 0;
    display: grid; place-items: center; border: 1px solid var(--tgl-border, currentColor);
    background: transparent; color: inherit; cursor: pointer; font-size: 14px;
    border-radius: 50%; opacity: 0.75; transition: opacity 0.15s ease; }
  .theme-toggle:hover { opacity: 1; }

</style>

<script>(function(){
  var root = document.documentElement;
  function current(){ return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  document.querySelectorAll('.theme-toggle').forEach(function(btn){
    function sync(){ btn.textContent = current() === 'light' ? '\u263E' : '\u2600'; }
    sync();
    btn.addEventListener('click', function(){
      var next = current() === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try{ localStorage.setItem('mvsp-dr-theme', next); }catch(e){}
      document.querySelectorAll('.theme-toggle').forEach(sync);
    });
  });
})();</script>
