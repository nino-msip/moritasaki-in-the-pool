<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setlist Tool — MoritaSaki in the pool</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .tool-container { max-width: 900px; }

    /* ── Input UI ── */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .meta-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    input[type="text"], input[type="date"], select {
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 14px;
      font-size: 14px;
      font-family: sans-serif;
      outline: none;
    }
    input[type="text"] { flex: 1; min-width: 200px; }
    input[type="date"] { min-width: 160px; color-scheme: dark; }
    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus { border-color: #fff; }
    input::placeholder { color: #555; }
    .se-group {
      display: flex; align-items: center; gap: 16px;
      min-height: 41px; color: #ccc; font-size: 14px;
    }
    .se-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .se-group input[type="radio"] { accent-color: #fff; }
    .meta-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 4px;
    }

    button {
      background: #fff; color: #000; border: none;
      padding: 10px 20px; font-size: 14px;
      font-family: sans-serif; cursor: pointer; letter-spacing: 0.05em;
    }
    button:hover { background: #ccc; }
    button.secondary {
      background: transparent; color: #fff; border: 1px solid #444;
    }
    button.secondary:hover { border-color: #fff; background: transparent; }
    button.pdf-btn {
      background: #cc1111; color: #fff; border: none;
    }
    button.pdf-btn:hover { background: #aa0000; }

    /* ── Drag list ── */
    #song-list { list-style: none; margin-bottom: 24px; padding: 0; }
    #song-list li {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border: 1px solid #222;
      margin-bottom: 3px; cursor: grab; user-select: none;
    }
    #song-list li.mc-row { color: #555; }
    #song-list li.dragging { opacity: 0.4; border-color: #fff; }
    #song-list li.drag-over { border-color: #666; background: #0a0a0a; }
    .song-num { color: #555; font-size: 12px; min-width: 28px; }
    .song-name { flex: 1; font-size: 14px; }
    .song-meta { font-size: 11px; color: #444; white-space: nowrap; }
    .remove-btn {
      background: transparent; color: #333; border: none;
      padding: 0 4px; font-size: 18px; cursor: pointer; line-height: 1;
    }
    .remove-btn:hover { color: #fff; }

    /* ── Tabs ── */
    .tab-nav {
      display: flex; gap: 4px; margin-top: 48px;
      border-bottom: 1px solid #333;
    }
    .tab-btn {
      background: transparent; color: #555;
      border: 1px solid #333; border-bottom: none;
      padding: 10px 24px; font-size: 13px; cursor: pointer;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #fff; border-color: #fff; background: #000; }
    .tab-panel { padding: 24px 0; display: none; }
    .tab-panel.active { display: block; }

    /* ── Sheet header (inside output) ── */
    .print-sheet { font-family: 'Arial', sans-serif; }

    .sheet-meta { margin-bottom: 2px; padding: 0; text-align: center; }
    .sheet-meta-date  { font-size: 18px; color: #111; padding: 4px 0; font-weight: 700; }
    .sheet-meta-venue { font-size: 18px; color: #111; padding: 2px 0; font-weight: 700; }
    .sheet-meta-sub   { font-size: 14px; color: #111; padding: 2px 0; font-weight: 600; }
    .sheet-logo-bar {
      display: block; text-align: center;
      background: #cc1111; color: #fff;
      font-weight: 900; font-style: italic;
      font-size: 28px; padding: 22px 20px;
      margin: 10px 0 0 0; letter-spacing: 0.02em;
    }
    .sheet-logo-img {
      display: block;
      width: 62%;
      max-width: 600px;
      height: auto;
      margin: 10px auto 28px;
    }

    /* ── Combined table (照明・音響) ── */
    .sheet-wrap { overflow-x: auto; margin-bottom: 16px; }
    .output-table {
      border-collapse: collapse; font-size: 12px;
      background: #fff; color: #000;
      width: 100%; max-width: none; min-width: 760px;
      table-layout: fixed;
    }
    .output-table th {
      background: #f3f3f3; color: #000; font-weight: 600;
      font-size: 12px; text-align: center; padding: 8px 12px;
      border: 1px solid #b7b7b7; white-space: nowrap;
    }
    .output-table td {
      padding: 8px 12px; border: 1px solid #d0d0d0;
      font-size: 12px; text-align: center; vertical-align: middle;
      background: #fff; color: #000; line-height: 1.5;
    }
    .output-table td.text-left { text-align: left; white-space: pre-line; }
    .output-table tr.mc-row td { background: #f9f9f9; color: #999; font-style: italic; }
    .output-table tr.note-row td {
      background: #fff8c5; color: #c00000;
      font-size: 13px; font-weight: 700; text-align: center;
      border: 2px solid #c00000; padding: 10px;
      letter-spacing: 0.05em;
    }

    /* ── Count table (セットリスト) ── */
    .count-table {
      border-collapse: collapse; font-size: 18px;
      background: #fff; color: #000;
      width: 100%; border: 3px solid #000;
    }
    .count-table thead tr { border-bottom: 3px solid #000; }
    .count-table th {
      font-style: italic; font-weight: 700;
      text-align: center; padding: 8px;
      border: none; border-right: 1px solid #000;
      background: #fff; color: #000; font-size: 12px;
    }
    .count-table th:last-child { border-right: none; }
    .count-table td {
      padding: 18px 8px; border: none;
      border-bottom: 1px dotted #000;
      border-right: 1px solid #000;
      text-align: center; vertical-align: middle;
      background: #fff; color: #000;
    }
    .count-table td:last-child { border-right: none; }
    .count-table tr:last-child td { border-bottom: none; }
    .count-table td.col-num {
      width: 72px; font-weight: 700; font-size: 18px; color: #111;
    }
    .count-table td.col-song {
      font-weight: 700; font-size: 20px;
    }
    .count-table td.col-count {
      width: 96px; font-weight: 700; font-size: 18px;
    }
    .count-table tr.mc-row td {
      font-weight: 700; font-size: 18px;
      border-bottom: 1px dotted #000;
    }

    .total-time {
      font-size: 12px; color: #555;
      text-align: right; margin-bottom: 8px;
    }
    .actions-row {
      display: flex; gap: 8px; margin-top: 12px;
      flex-wrap: wrap; align-items: center;
    }
    .copy-msg {
      font-size: 12px; color: #aaa;
      opacity: 0; transition: opacity 0.3s;
    }

    .back-link {
      display: inline-block; color: #555;
      text-decoration: none; font-size: 13px; margin-bottom: 40px;
    }
    .back-link:hover { color: #fff; }

    /* ── Print ── */
    /* @page margin:0 でブラウザのヘッダー/フッター（about:blank・日時等）を非表示にし、
       代わりに body 側に余白を持たせる */
    @page { size: A4; margin: 0; }
    @media print {
      nav, .input-area, .meta-area, #song-list,
      .generate-area, .tab-nav, .actions-row,
      .back-link, h2, section > div > p, #mp3-section { display: none !important; }

      body, section { background: #fff !important; padding: 0 !important; }
      .tab-panel { display: none !important; }
      .tab-panel.print-target { display: block !important; }
      #output-section { display: block !important; }
      .tool-container { max-width: 100% !important; padding: 15mm; }

      .output-table th, .output-table td { font-size: 11px; padding: 6px 10px; }
      .sheet-logo-bar { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .output-table tr.note-row td { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>

  <section style="min-height: auto; padding-bottom: 120px;">
    <div class="tool-container">
      <a href="index.html" class="back-link">← Back to site</a>
      <h2>Setlist Tool</h2>
      <p>ライブ情報を入力し、曲を追加してシートを生成してください。</p>

      <!-- ライブ情報 -->
      <div class="meta-area" style="margin-top: 32px; display:flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px;">
        <div>
          <span class="meta-label">日程</span>
          <input type="date" id="live-date" />
        </div>
        <div style="flex:1; min-width:200px;">
          <span class="meta-label">会場</span>
          <input type="text" id="live-venue" placeholder="会場名を入力..." style="width:100%;" />
        </div>
        <div style="min-width:180px;">
          <span class="meta-label">出演順</span>
          <input type="text" id="live-order" placeholder="例: 3番目（全5組）" style="width:100%;" />
        </div>
        <div>
          <span class="meta-label">SE（入場曲）</span>
          <div class="se-group">
            <label><input type="radio" name="se-flag" value="無し" checked onchange="onSEChange()" /> 無し</label>
            <label><input type="radio" name="se-flag" value="有り" onchange="onSEChange()" /> 有り</label>
            <span id="se-media-wrap" style="display:none;">
              <select id="se-media" onchange="onSEMediaChange()">
                <option value="CD">CD</option>
                <option value="スマホ・携帯">スマホ・携帯</option>
                <option value="その他">その他</option>
              </select>
            </span>
            <input type="text" id="se-media-other" placeholder="持参メディアを入力..." style="display:none; min-width:160px; flex:0 1 auto;" />
          </div>
        </div>
      </div>

      <!-- 曲追加 -->
      <div class="input-area">
        <div class="input-row">
          <input type="text" id="song-input" list="song-suggestions" placeholder="曲名を検索・入力..." autocomplete="off" />
          <datalist id="song-suggestions"></datalist>
          <button onclick="addSong()">追加</button>
          <button class="secondary" onclick="addMC()">MC を挿入</button>
        </div>
      </div>

      <ul id="song-list"></ul>

      <div class="generate-area" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px;">
        <button onclick="generateSheets()">シートを生成</button>
        <button class="secondary" onclick="clearAll()">クリア</button>
      </div>

      <!-- Output -->
      <div id="output-section" style="display:none;">
        <div class="tab-nav">
          <button class="tab-btn active" onclick="switchTab('combined', this)">照明・音響要望シート</button>
          <button class="tab-btn" onclick="switchTab('count', this)">セットリスト</button>
        </div>

        <!-- 照明・音響要望シート -->
        <div id="tab-combined" class="tab-panel active">
          <div class="total-time" id="total-combined"></div>
          <div class="print-sheet" id="sheet-combined"></div>
          <div class="actions-row">
            <button class="pdf-btn" onclick="printTab('combined')">PDFとして保存</button>
            <button class="secondary" onclick="downloadXlsxSheet('combined')">編集用スプレッドシート（.xlsx）</button>
            <button class="secondary" onclick="downloadCsv('combined')">CSVダウンロード（Excel用）</button>
            <button class="secondary" onclick="copySheet('combined')">テキストをコピー（スプレッドシート貼付用）</button>
            <span class="copy-msg" id="msg-combined"></span>
          </div>
        </div>

        <!-- セットリスト -->
        <div id="tab-count" class="tab-panel">
          <div class="print-sheet" id="sheet-count"></div>
          <div class="actions-row">
            <button class="pdf-btn" onclick="printTab('count')">PDFとして保存</button>
            <button class="secondary" onclick="downloadXlsxSheet('count')">編集用スプレッドシート（.xlsx）</button>
            <button class="secondary" onclick="downloadCsv('count')">CSVダウンロード（Excel用）</button>
            <button class="secondary" onclick="copySheet('count')">テキストをコピー（スプレッドシート貼付用）</button>
            <span class="copy-msg" id="msg-count"></span>
          </div>
        </div>

        <!-- スタッフ用（セット図・音源ダウンロード） -->
        <div id="mp3-section" style="margin-top:40px; border-top:1px solid #222; padding-top:32px;">
          <p style="color:#555; font-size:13px; margin-bottom:16px;">🔒 スタッフ用 — セット図・音源ファイルのダウンロード</p>
          <div id="mp3-auth">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <input type="password" id="mp3-pw" placeholder="パスワードを入力..." style="flex:1; min-width:200px;" onkeydown="if(event.key==='Enter')checkMp3Password()" />
              <button onclick="checkMp3Password()">確認</button>
            </div>
            <p id="mp3-pw-error" style="color:#cc1111; font-size:12px; margin-top:8px; display:none;">パスワードが違います</p>
          </div>
          <div id="mp3-download" style="display:none;">

            <!-- 会場セット図 -->
            <div id="setzu-block" style="margin-bottom:36px;">
              <p style="color:#aaa; font-size:12px; margin-bottom:12px;">会場を選択すると、対応するセット図を表示します</p>
              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <span class="meta-label" style="margin:0;">会場</span>
                <select id="setzu-venue" onchange="renderSetzu()" style="min-width:220px;"></select>
              </div>
              <p id="setzu-status" style="font-size:12px; color:#777; margin-top:8px;"></p>
              <div id="setzu-view" style="margin-top:16px;"></div>
              <div class="actions-row" style="margin-top:16px;">
                <button class="pdf-btn" onclick="printStaffSheet()">スタッフ用シートをPDF保存（1p:セット図 / 2p:音響要望）</button>
                <button class="secondary" onclick="downloadStaffXlsx()">編集用スプレッドシート（.xlsx）</button>
                <button class="secondary" onclick="downloadStaffCsv()">スタッフ用CSVをダウンロード</button>
              </div>
            </div>

            <!-- MP3 ダウンロード -->
            <p style="color:#aaa; font-size:12px; margin-bottom:12px;">セットリストの曲をZIPでダウンロードします</p>
            <div class="actions-row">
              <button class="pdf-btn" onclick="downloadMp3Zip()">MP3をまとめてダウンロード</button>
              <span id="mp3-status" style="font-size:12px; color:#aaa;"></span>
            </div>
            <ul id="mp3-file-list" style="margin-top:16px; list-style:none; padding:0; font-size:12px; color:#555;"></ul>
          </div>
        </div>
      </div>
    </div>
  </section>

    const WEEKDAY_JA = ['日', '月', '火', '水', '木', '金', '土'];

    let items = [];
    let dragSrc = null;

    function updateDatalist() {
      const dl = document.getElementById('song-suggestions');
      const used = new Set(items.filter(i => i.type === 'song').map(i => i.name));
      dl.innerHTML = '';
      Object.keys(SONG_DB).sort().forEach(name => {
        if (!used.has(name)) {
          const opt = document.createElement('option');
          opt.value = name;
          dl.appendChild(opt);
        }
      });
    }
    updateDatalist();

    document.getElementById('song-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addSong();
    });

    // ── List management ──────────────────────────────────────────────────

    function addSong() {
      const input = document.getElementById('song-input');
      const name = input.value.trim();
      if (!name) return;
      if (items.some(i => i.type === 'song' && i.name === name)) {
        input.select();
        input.style.borderColor = '#cc1111';
        setTimeout(() => { input.style.borderColor = ''; }, 1200);
        return;
      }
      items.push({ type: 'song', name });
      input.value = '';
      input.focus();
      renderList();
    }

    function addMC() {
      items.push({ type: 'mc', name: 'MC' });
      renderList();
    }

    function removeItem(i) {
      items.splice(i, 1);
      renderList();
    }

    function renderList() {
      const list = document.getElementById('song-list');
      list.innerHTML = '';
      let songCount = 0;
      items.forEach((item, i) => {
        const isMC = item.type === 'mc';
        if (!isMC) songCount++;
        const data = (!isMC && SONG_DB[item.name]) || {};
        const li = document.createElement('li');
        if (isMC) li.classList.add('mc-row');
        li.draggable = true;
        li.dataset.index = i;
        const meta = (!isMC && data.duration) ? data.duration : '';
        const inDB = !isMC && !!SONG_DB[item.name];
        li.innerHTML = `
          <span class="song-num">${isMC ? 'MC' : songCount + '.'}</span>
          <span class="song-name">${escapeHtml(item.name)}${!inDB && !isMC ? ' <span style="color:#555;font-size:11px;">（DBになし）</span>' : ''}</span>
          ${meta ? `<span class="song-meta">${meta}</span>` : ''}
          <button class="remove-btn" onclick="removeItem(${i})">×</button>
        `;
        li.addEventListener('dragstart', onDragStart);
        li.addEventListener('dragover',  onDragOver);
        li.addEventListener('dragleave', onDragLeave);
        li.addEventListener('drop',      onDrop);
        li.addEventListener('dragend',   onDragEnd);
        list.appendChild(li);
      });
      updateDatalist();
    }

    function onDragStart(e) { dragSrc = this; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
    function onDragOver(e)  { e.preventDefault(); this.classList.add('drag-over'); }
    function onDragLeave()  { this.classList.remove('drag-over'); }
    function onDrop(e) {
      e.preventDefault();
      if (dragSrc === this) return;
      const from = parseInt(dragSrc.dataset.index);
      const to   = parseInt(this.dataset.index);
      const moved = items.splice(from, 1)[0];
      items.splice(to, 0, moved);
      renderList();
    }
    function onDragEnd() {
      document.querySelectorAll('#song-list li').forEach(li => li.classList.remove('dragging', 'drag-over'));
    }

    // ── Helpers ──────────────────────────────────────────────────────────

    function parseDuration(dur) {
      if (!dur || dur === '-') return 0;
      const parts = dur.trim().split(':');
      return parts.length === 2 ? (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0) : 0;
    }

    function formatDuration(sec) {
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    function formatDateDisplay(isoDate) {
      if (!isoDate) return '';
      const d = new Date(isoDate + 'T00:00:00');
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const wd = WEEKDAY_JA[d.getDay()];
      return `${y}/${m}/${day}（${wd}）`;
    }

    // ── SE（入場曲）UI ──
    function onSEChange() {
      const hasSE = document.querySelector('input[name="se-flag"]:checked').value === '有り';
      document.getElementById('se-media-wrap').style.display = hasSE ? '' : 'none';
      if (!hasSE) document.getElementById('se-media-other').style.display = 'none';
      else onSEMediaChange();
    }
    function onSEMediaChange() {
      const isOther = document.getElementById('se-media').value === 'その他';
      document.getElementById('se-media-other').style.display = isOther ? '' : 'none';
    }
    function getSEText() {
      const hasSE = document.querySelector('input[name="se-flag"]:checked').value === '有り';
      if (!hasSE) return 'SE: 無し';
      let media = document.getElementById('se-media').value;
      if (media === 'その他') {
        const other = document.getElementById('se-media-other').value.trim();
        media = other || 'その他';
      }
      return `SE: 有り（${media}持参）`;
    }
    function getOrderText() {
      const v = document.getElementById('live-order').value.trim();
      return v ? `出演順: ${v}` : '';
    }

    function buildHeader(includeMeta) {
      const dateVal  = document.getElementById('live-date').value;
      const venueVal = document.getElementById('live-venue').value.trim();
      const dateStr  = dateVal  ? formatDateDisplay(dateVal) : '';
      const venueStr = venueVal ? `@ ${venueVal}` : '';
      const orderStr = includeMeta ? getOrderText() : '';
      const seStr    = includeMeta ? getSEText()    : '';
      const logoUrl = new URL('logo.avif', document.baseURI).href;
      return `
        <div class="sheet-meta">
          ${dateStr  ? `<div class="sheet-meta-date">${escapeHtml(dateStr)}</div>`  : ''}
          ${venueStr ? `<div class="sheet-meta-venue">${escapeHtml(venueStr)}</div>` : ''}
          ${orderStr ? `<div class="sheet-meta-sub">${escapeHtml(orderStr)}</div>` : ''}
          ${seStr    ? `<div class="sheet-meta-sub">${escapeHtml(seStr)}</div>`    : ''}
        </div>
        <img class="sheet-logo-img" src="${logoUrl}" alt="MoritaSaki in the pool"
             onerror="this.outerHTML='&lt;div class=&quot;sheet-logo-bar&quot;&gt;MoritaSaki in the pool&lt;/div&gt;'" />
      `;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Generate ─────────────────────────────────────────────────────────

    function generateSheets() {
      if (items.filter(i => i.type === 'song').length === 0) {
        alert('曲を追加してください。');
        return;
      }
      renderCombined();
      renderCount();
      const out = document.getElementById('output-section');
      out.style.display = 'block';
      out.scrollIntoView({ behavior: 'smooth' });

    function renderCombined() {
      let songCount = 0, totalSec = 0, rows = '';
      items.forEach(item => {
        if (item.type === 'mc') {
          rows += `<tr class="mc-row"><td></td><td>MC</td><td>-</td><td>-</td><td>00:00</td></tr>`;
          return;
        }
        songCount++;
        const d = SONG_DB[item.name] || {};
        const dur = d.duration || '-';
        totalSec += parseDuration(dur);
        rows += `<tr>
          <td>${songCount}.</td>
          <td>${escapeHtml(item.name)}</td>
          <td class="text-left">${escapeHtml(d.lighting || '-')}</td>
          <td class="text-left">${escapeHtml(d.sound    || '-')}</td>
          <td>${escapeHtml(dur)}</td>
        </tr>`;
      });
      rows += `<tr class="note-row"><td colspan="5">※全曲ストロボは無しでお願いします</td></tr>`;

      document.getElementById('total-combined').textContent = `合計時間（曲のみ）: ${formatDuration(totalSec)}`;

    function renderCount() {
      let songCount = 0, rows = '';

            <td class="col-song">MC</td>

          <td class="col-num">${songCount}.</td>
          <td class="col-song">${escapeHtml(item.name)}</td>
          <td class="col-count">${escapeHtml(count)}</td>

    // ── Copy text ────────────────────────────────────────────────────────

    function copySheet(tab) {
      const sheetEl = document.getElementById('sheet-' + tab);
      const titles  = { combined: '照明・音響要望シート', count: 'セットリスト' };
      const dateVal  = document.getElementById('live-date').value;
      const venueVal = document.getElementById('live-venue').value.trim();

      let text = `【MoritaSaki in the pool ${titles[tab]}】\n`;
      if (dateVal)  text += formatDateDisplay(dateVal) + '\n';
      if (venueVal) text += `@ ${venueVal}\n`;
      if (tab === 'combined') {
        const orderStr = getOrderText();
        if (orderStr) text += orderStr + '\n';
        text += getSEText() + '\n';
      }
      text += '\n';

      const headers = sheetEl.querySelectorAll('thead th');
      text += Array.from(headers).map(h => h.textContent.trim()).join('\t') + '\n';
      sheetEl.querySelectorAll('tbody tr').forEach(row => {
        const cells = row.querySelectorAll('td');
        text += Array.from(cells).map(c => c.textContent.trim().replace(/\n/g,' ')).join('\t') + '\n';
      });

      const totalEl = document.getElementById('total-combined');
      if (tab === 'combined' && totalEl) text += '\n' + totalEl.textContent.trim();

      navigator.clipboard.writeText(text).then(() => {
        const msg = document.getElementById('msg-' + tab);
        if (!msg) return;
        msg.textContent = 'コピーしました';
        msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2000);
      });
    }

    // ── CSV download（Excel・スプレッドシートで編集できる形式）──────────

    function csvEscape(v) {
      const s = String(v == null ? '' : v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function buildCsvRows(tab) {
      const titles  = { combined: '照明・音響要望シート', count: 'セットリスト' };
      const dateVal  = document.getElementById('live-date').value;
      const venueVal = document.getElementById('live-venue').value.trim();
      const rows = [];
      rows.push([`MoritaSaki in the pool ${titles[tab]}`]);
      if (dateVal)  rows.push(['日付', formatDateDisplay(dateVal)]);
      if (venueVal) rows.push(['会場', venueVal]);
      if (tab === 'combined') {
        const orderVal = document.getElementById('live-order').value.trim();
        if (orderVal) rows.push(['出演順', orderVal]);
        rows.push(['SE', getSEText().replace(/^SE: /, '')]);
      }
      rows.push([]);

      let songCount = 0, totalSec = 0;
      if (tab === 'combined') {
        rows.push(['曲順', '曲名', '照明要望', '音響要望', '所要時間(m:s)']);
        items.forEach(item => {
          if (item.type === 'mc') { rows.push(['', 'MC', '-', '-', '00:00']); return; }
          songCount++;
          const d = SONG_DB[item.name] || {};
          totalSec += parseDuration(d.duration || '-');
          rows.push([songCount, item.name, d.lighting || '-', d.sound || '-', d.duration || '-']);
        });
        rows.push([]);
        rows.push(['※全曲ストロボは無しでお願いします']);
        rows.push(['合計時間（曲のみ）', formatDuration(totalSec)]);
      } else {
        rows.push(['number', 'songs', 'count']);
        items.forEach(item => {
          if (item.type === 'mc') { rows.push(['', 'MC', '']); return; }
          songCount++;
          const d = SONG_DB[item.name] || {};
          rows.push([songCount, item.name, (d.count && d.count !== '-') ? d.count : '']);
        });
      }
      return rows;
    }

    function downloadCsvFile(rows, filename) {
      const csv = '\uFEFF' + rows.map(r => r.map(csvEscape).join(',')).join('\r\n'); // BOM付きでExcelの文字化けを防ぐ
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    function downloadCsv(tab) {
      const titles = { combined: '照明音響要望', count: 'セットリスト' };
      const dateVal = document.getElementById('live-date').value;
      const venueVal = document.getElementById('live-venue').value.trim();
      const label = [dateVal, venueVal].filter(Boolean).join('_');
      downloadCsvFile(buildCsvRows(tab), `${label ? label + '_' : ''}${titles[tab]}.csv`);
    }

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkMp3Password() {
      const pw = document.getElementById('mp3-pw').value;
      const hash = await sha256(pw);
      if (hash === MP3_PW_HASH) {
        document.getElementById('mp3-auth').style.display = 'none';
        document.getElementById('mp3-download').style.display = 'block';
        renderMp3List();

        li.style.padding = '4px 0';

    async function downloadMp3Zip() {
      const allSongs = items.filter(i => i.type === 'song');
      const songs = allSongs.filter(i => SONG_FILE[i.name]);
      if (songs.length === 0) { alert('ダウンロード可能な曲がありません'); return; }

      const status = document.getElementById('mp3-status');
      status.textContent = '準備中...';

      const zip = new JSZip();
      const folder = zip.folder('setlist_mp3');
      let loaded = 0;

      for (let idx = 0; idx < songs.length; idx++) {
        const item = songs[idx];
        const filename = SONG_FILE[item.name];
        const num = String(allSongs.indexOf(item) + 1).padStart(2, '0'); // セトリ上の曲順
        try {
          const res = await fetch(`sounds/${filename}`);
          if (!res.ok) throw new Error(`not found: ${filename}`);
          const blob = await res.blob();
          folder.file(`${num}_${filename}`, blob);
          loaded++;
          status.textContent = `読み込み中... ${loaded}/${songs.length}`;
        } catch {
          status.textContent = `⚠ ${filename} が見つかりません`;
        }
      }

      const content = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content);
      const dateVal = document.getElementById('live-date').value;
      const venueVal = document.getElementById('live-venue').value.trim();
      const label = [dateVal, venueVal].filter(Boolean).join('_') || 'setlist';
      a.download = `${label}_mp3.zip`;
      a.click();
      status.textContent = 'ダウンロード完了';
    }

    // ── 会場セット図（スタッフ用） ───────────────────────────────────────
    // ★ 会場別セット図シート（タブ）を「ファイル → 共有 → ウェブに公開 → CSV」で

    //    出てきたURL（gid=... 付き）をこの配列に追加する。
    //    シート内の「会場：○○」の行から会場名を自動取得する。
    const SETZU_PUB_BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMfimo3jxFyoJw4wcKZN1uz9LjpD0BE3pquxsfxECmfrEb-IX9Eqls7CAXaOAt2lL_JG-EzCkQpPO_/pub';

    const SETZU_GIDS = [
      '774749046',  // UrBANGUILD

    let setzuData = []; // [{ venue, amps:[{use,num,model,note}], gear:[{part,text}], monitor:[{part,text}] }]

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          if (inQ && text[i + 1] === '"') { cell += '"'; i++; }
          else inQ = !inQ;
        } else if (c === ',' && !inQ) {
          row.push(cell); cell = '';
        } else if ((c === '\n' || c === '\r') && !inQ) {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); rows.push(row); row = []; cell = '';
        } else {
          cell += c;
        }
      }
      if (row.length || cell) { row.push(cell); rows.push(row); }
      return rows;
    }

    // Google Drive の共有URLからファイルIDを抽出
    function driveFileId(u) {
      if (!u) return null;
      const m = String(u).match(/[?&]id=([\w-]+)|\/d\/([\w-]+)/);
      return m ? (m[1] || m[2]) : null;
    }

    // 会場シート（セルで描かれたセット図）のCSVから構造化データを抽出する。
    // 認識するブロック: 「会場：○○」/ 「○○ Amp」行（❶❷…の番号付き）/
    // 「持ち込み機材」「初期返し要望」（パート名＋内容の行が続く）
    // ※会場タブによって表の開始列がずれるため、ラベルの位置を行ごとに探して
    //   その右隣を key 列として扱う（列位置に依存しない）。
    function parseVenueSheet(rows) {
      const d = { venue: '', amps: [], gear: [], monitor: [] };
      const NUM_RE = /^[❶-❿①-⑳]/; // ❶-❿ ①-⑳
      let section = '';
      let ampUse = '';
      let keyCol = -1; // セクションの key（番号/パート名）が入る列

      for (const raw of rows) {
        const c = raw.map(x => (x || '').trim());
        if (!d.venue) {
          const hit = c.find(x => /会場[：:]/.test(x));
          if (hit) { d.venue = hit.replace(/.*会場[：:]\s*/, '').trim(); continue; }
        }

        // セクション見出しを行内から探す
        const ampIdx = c.findIndex(x => /Amp$/i.test(x));
        const gearIdx = c.indexOf('持ち込み機材');
        const monIdx = c.indexOf('初期返し要望');

        if (ampIdx >= 0) {
          section = 'amp';
          ampUse = c[ampIdx];
          keyCol = ampIdx + 1;
          if (c[keyCol]) d.amps.push({ use: ampUse, num: c[keyCol], model: c[keyCol + 1] || '', note: c[keyCol + 2] || '' });
          continue;
        }
        if (gearIdx >= 0) {
          section = 'gear';
          keyCol = gearIdx + 1;
          if (c[keyCol]) d.gear.push({ part: c[keyCol], text: c[keyCol + 1] || '' });
          continue;
        }
        if (monIdx >= 0) {
          section = 'monitor';
          keyCol = monIdx + 1;
          if (c[keyCol]) d.monitor.push({ part: c[keyCol], text: c[keyCol + 1] || '' });
          continue;
        }

        if (!section || keyCol < 0) continue;
        if (c[keyCol - 1]) { section = ''; continue; } // 別の未知ラベル → セクション終了
        const key = c[keyCol] || '';
        if (!key) continue; // 空行はスキップ（セクション継続）

        if (section === 'amp' && NUM_RE.test(key)) d.amps.push({ use: ampUse, num: key, model: c[keyCol + 1] || '', note: c[keyCol + 2] || '' });
        else if (section === 'gear') d.gear.push({ part: key, text: c[keyCol + 1] || '' });
        else if (section === 'monitor') d.monitor.push({ part: key, text: c[keyCol + 1] || '' });
      }
      return d;
    }

    async function loadSetzu() {
      const status = document.getElementById('setzu-status');
      const select = document.getElementById('setzu-venue');
      if (!SETZU_CSV_URLS.length) {
        status.textContent = 'セット図データのURLが未設定です（会場シートを「ウェブに公開 → CSV」して SETZU_CSV_URLS に追加してください）';
        select.innerHTML = '<option value="">— データ未設定 —</option>';
        return;
      }
      status.textContent = 'セット図データを読み込み中...';
      try {
        const results = await Promise.allSettled(SETZU_CSV_URLS.map(async url => {
          const res = await fetch(url);
          if (!res.ok) throw new Error('fetch failed');
          return parseVenueSheet(parseCSV(await res.text()));
        }));
        setzuData = results
          .filter(r => r.status === 'fulfilled' && r.value.venue)
          .map(r => r.value);
        if (!setzuData.length) throw new Error('no venues');

        select.innerHTML = '<option value="">— 会場を選択 —</option>' +
          setzuData.map((d, i) => `<option value="${i}">${escapeHtml(d.venue)}</option>`).join('');
        status.textContent = '';
        autoSelectSetzuVenue();
      } catch {
        status.textContent = 'セット図データの取得に失敗しました（公開設定・URLを確認してください）';
        select.innerHTML = '<option value="">— 取得失敗 —</option>';
      }
    }

    function autoSelectSetzuVenue() {

      const idx = setzuData.findIndex(d => {
        const v = d.venue.toLowerCase();
        return v.includes(input) || input.includes(v);

      if (idx >= 0) {

    // アンプの用途 → 図・表で共通の色
    function ampColor(use) {
      if (/VoGt/i.test(use)) return '#f0932b'; // オレンジ
      if (/VoBa/i.test(use)) return '#e02020'; // 赤
      if (/Gt/i.test(use))   return '#f5e642'; // 黄
      return '#999';
    }

    // ❶→1 / ①→1 の変換（図中は普通の数字で表示）
    function plainNum(s) {
      const code = (s || '').codePointAt(0) || 0;
      if (code >= 0x2776 && code <= 0x277F) return String(code - 0x2775); // ❶-❿
      if (code >= 0x2460 && code <= 0x2473) return String(code - 0x245F); // ①-⑳
      return s;
    }

    // セット図（ステージ配置）をアンプデータから自動描画
    function setzuDiagramSvg(d) {
      if (!d.amps.length) return '';
      const W = 800, H = 430;
      let s = '';

      // ステージ枠
      s += `<rect x="20" y="16" width="760" height="360" rx="14" fill="#fff" stroke="#333" stroke-width="2"/>`;

      // マイクスタンド記号（円＋スタンド）
      const mic = (x, y) => `
        <line x1="${x}" y1="${y}" x2="${x}" y2="${y + 22}" stroke="#333" stroke-width="2"/>
        <circle cx="${x}" cy="${y - 2}" r="7" fill="none" stroke="#333" stroke-width="2"/>
        <line x1="${x - 7}" y1="${y - 2}" x2="${x + 7}" y2="${y - 2}" stroke="#333" stroke-width="1.5"/>`;

      // モニター記号（封筒型ウェッジ）
      const wedge = (x, y) => `
        <rect x="${x - 18}" y="${y}" width="36" height="24" fill="#fff" stroke="#333" stroke-width="2"/>
        <path d="M ${x - 18} ${y} L ${x} ${y + 13} L ${x + 18} ${y}" fill="none" stroke="#333" stroke-width="2"/>`;

      // Dr.（中央奥）＋マイク
      s += `<rect x="362" y="38" width="76" height="42" rx="8" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
            <text x="400" y="64" text-anchor="middle" font-size="15" fill="#888" font-family="Arial">Dr.</text>`;
      s += mic(462, 52);
      s += wedge(496, 40);

      // アンプ（VoBa → VoGt → Gt の順に左から均等配置）
      const order = u => (/VoBa/i.test(u) ? 0 : /VoGt/i.test(u) ? 1 : 2);
      const amps = [...d.amps].sort((a, b) => order(a.use) - order(b.use) || plainNum(a.num) - plainNum(b.num));
      const n = amps.length;
      amps.forEach((a, i) => {
        const cx = 110 + (580 / Math.max(n - 1, 1)) * i;
        const col = ampColor(a.use);
        s += `<rect x="${cx - 45}" y="118" width="90" height="46" rx="10" fill="#111" stroke="${col}" stroke-width="7"/>
              <text x="${cx}" y="148" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff" font-family="Arial">${escapeHtml(plainNum(a.num))}</text>`;
      });

      // メンバー（標準立ち位置: Vo.Ba 左 / Vo.Gt 中央 / Gt 上手）＋ボーカルマイク
      const members = [['Vo.Ba.', 150], ['Vo.Gt.', 400], ['Gt.', 650]];
      members.forEach(([label, cx]) => {
        s += `<rect x="${cx - 38}" y="222" width="76" height="40" rx="8" fill="#fff" stroke="#aaa" stroke-width="1.5"/>
              <text x="${cx}" y="247" text-anchor="middle" font-size="14" fill="#888" font-family="Arial">${label}</text>`;
      });
      s += mic(150, 288) + mic(400, 288);

      // 転がしモニター（前列4つ）
      [150, 320, 480, 650].forEach(x => { s += wedge(x, 330); });

      s += `<text x="400" y="408" text-anchor="middle" font-size="15" fill="#333" font-family="Arial">フロア</text>`;

      return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
                   style="width:100%; max-width:560px; display:block; margin:0 auto 16px; background:#fff;">${s}</svg>`;
    }

    // セット情報を表として組み立てる（画面用/印刷用共通。スタイルはCSSクラスで分岐）
    function setzuTablesHtml(d) {
      const section = (title, headHtml, bodyHtml) => bodyHtml ? `
        <div class="setzu-section">
          <div class="setzu-section-title">${title}</div>
          <table class="setzu-table">
            <thead><tr>${headHtml}</tr></thead>
            <tbody>${bodyHtml}</tbody>
          </table>
        </div>` : '';

      const amps = d.amps.map(a => `<tr>
        <td class="setzu-num">${escapeHtml(a.num)}</td>
        <td style="background:${ampColor(a.use)}; font-weight:700; print-color-adjust:exact; -webkit-print-color-adjust:exact;">${escapeHtml(a.use)}</td>
        <td>${escapeHtml(a.model)}</td>
        <td>${escapeHtml(a.note)}</td>
      </tr>`).join('');

      const gear = d.gear.map(g => `<tr>
        <td class="setzu-part">${escapeHtml(g.part)}</td>
        <td class="text-left-cell">${escapeHtml(g.text)}</td>
      </tr>`).join('');

      const monitor = d.monitor.map(m => `<tr>
        <td class="setzu-part">${escapeHtml(m.part)}</td>
        <td class="text-left-cell">${escapeHtml(m.text)}</td>
      </tr>`).join('');

      return section('アンプ', '<th style="width:48px;">番号</th><th style="width:110px;">用途</th><th>機種</th><th style="width:110px;">レンタル/持込</th>', amps)
           + section('持ち込み機材', '<th style="width:110px;">パート</th><th>機材</th>', gear)
           + section('初期返し要望', '<th style="width:110px;">パート</th><th>要望</th>', monitor);
    }

    // ── 編集用スプレッドシート（.xlsx）出力 ───────────────────────────────
    // Googleドライブにアップすればスプレッドシートとして開いて編集可能。Excelでも開ける。
    // セット図は原本と同じ「色付きセル」で再現するので、シート上でそのまま編集できる。

    const XL = {
      border: { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } },
      fill: argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } }),
      center: { vertical: 'middle', horizontal: 'center', wrapText: true },
      left:   { vertical: 'middle', horizontal: 'left',   wrapText: true },
    };

    function ampArgb(use) { // ampColor と同じ配色（ARGB表記）
      if (/VoGt/i.test(use)) return 'FFF0932B';
      if (/VoBa/i.test(use)) return 'FFE02020';
      if (/Gt/i.test(use))   return 'FFF5E642';
      return 'FF999999';
    }

    // 日付/会場/出演順/SE ＋ 赤ロゴ帯 をシート先頭に書き、次の行番号を返す
    function xlsxHeader(ws, includeMeta, width) {
      const metas = [];
      const dateVal  = document.getElementById('live-date').value;
      const venueVal = document.getElementById('live-venue').value.trim();
      if (dateVal)  metas.push(formatDateDisplay(dateVal));
      if (venueVal) metas.push('@ ' + venueVal);
      if (includeMeta) {
        const o = getOrderText(); if (o) metas.push(o);
        const se = getSEText();   if (se) metas.push(se);
      }
      let r = 1;
      metas.forEach(t => {
        ws.mergeCells(r, 1, r, width);
        const c = ws.getCell(r, 1);
        c.value = t;
        c.font = { bold: true, size: 13 };
        c.alignment = XL.center;
        r++;
      });
      ws.mergeCells(r, 1, r, width);
      const logo = ws.getCell(r, 1);
      logo.value = 'MoritaSaki in the pool';
      logo.font = { bold: true, italic: true, size: 22, color: { argb: 'FFFFFFFF' } };
      logo.fill = XL.fill('FFCC1111');
      logo.alignment = XL.center;
      ws.getRow(r).height = 42;
      return r + 2;
    }

    // 見出し行＋データ行の表を書き、次の行番号を返す
    function xlsxTable(ws, r, headers, rows) {
      headers.forEach((h, i) => {
        const c = ws.getCell(r, i + 1);
        c.value = h;
        c.font = { bold: true, size: 10 };
        c.fill = XL.fill('FFF3F3F3');
        c.border = XL.border;
        c.alignment = XL.center;
      });
      r++;
      rows.forEach(row => {
        row.forEach((cell, i) => {
          const c = ws.getCell(r, i + 1);
          c.value = cell.v;
          c.border = XL.border;
          c.alignment = cell.align === 'left' ? XL.left : XL.center;
          c.font = { size: cell.size || 10, bold: !!cell.bold };
          if (cell.fill) c.fill = XL.fill(cell.fill);
        });
        r++;
      });
      return r + 1;
    }

    function xlsxSectionTitle(ws, r, width, text) {
      ws.mergeCells(r, 1, r, width);
      const c = ws.getCell(r, 1);
      c.value = text;
      c.font = { bold: true, size: 12 };
      c.alignment = XL.left;
      return r + 1;
    }

    function combinedRowsData() {
      let n = 0, totalSec = 0;
      const rows = [];
      items.forEach(item => {
        if (item.type === 'mc') {
          rows.push([{ v: '' }, { v: 'MC', bold: true }, { v: '-' }, { v: '-' }, { v: '00:00' }]);
          return;
        }
        n++;
        const d = SONG_DB[item.name] || {};
        totalSec += parseDuration(d.duration || '-');
        rows.push([
          { v: n + '.' },
          { v: item.name, bold: true },
          { v: d.lighting || '-', align: 'left' },
          { v: d.sound || '-', align: 'left' },
          { v: d.duration || '-' },
        ]);
      });
      return { rows, totalSec };
    }

    // 照明・音響要望の表をワークシートへ書き込む
    function writeCombinedSheet(ws, includeMeta) {
      ws.columns = [{ width: 6 }, { width: 24 }, { width: 40 }, { width: 40 }, { width: 9 }];
      let r = xlsxHeader(ws, includeMeta, 5);
      const { rows, totalSec } = combinedRowsData();
      r = xlsxTable(ws, r, ['曲順', '曲名', '照明要望', '音響要望', '時間(m:s)'], rows) - 1;
      ws.mergeCells(r, 1, r, 5);
      const note = ws.getCell(r, 1);
      note.value = '※全曲ストロボは無しでお願いします';
      note.font = { bold: true, size: 11, color: { argb: 'FFC00000' } };
      note.fill = XL.fill('FFFFF8C5');
      note.alignment = XL.center;
      note.border = XL.border;
      r += 1;
      const total = ws.getCell(r, 5);
      total.value = '合計 ' + formatDuration(totalSec);
      total.font = { size: 10 };
      total.alignment = XL.center;
      return r + 1;
    }

    function saveWorkbook(wb, filename) {
      wb.xlsx.writeBuffer().then(buf => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        a.download = filename;
        a.click();
      });
    }

    function xlsxFileLabel() {
      const dateVal  = document.getElementById('live-date').value;
      const venueVal = document.getElementById('live-venue').value.trim();
      return [dateVal, venueVal].filter(Boolean).join('_');
    }

    async function downloadXlsxSheet(tab) {
      if (items.filter(i => i.type === 'song').length === 0) {
        alert('曲を追加してください。');
        return;
      }
      const wb = new ExcelJS.Workbook();
      if (tab === 'combined') {
        writeCombinedSheet(wb.addWorksheet('照明・音響要望'), true);
      } else {
        const ws = wb.addWorksheet('セットリスト');
        ws.columns = [{ width: 8 }, { width: 44 }, { width: 10 }];
        let r = xlsxHeader(ws, false, 3);
        let n = 0;
        const rows = items.map(item => {
          if (item.type === 'mc') return [{ v: '' }, { v: 'MC', bold: true, size: 14 }, { v: '' }];
          n++;
          const d = SONG_DB[item.name] || {};
          return [
            { v: n + '.', bold: true, size: 12 },
            { v: item.name, bold: true, size: 14 },
            { v: d.count && d.count !== '-' ? d.count : '', bold: true, size: 12 },
          ];
        });
        const start = r + 1;
        r = xlsxTable(ws, r, ['number', 'songs', 'count'], rows);
        for (let i = start; i < r - 1; i++) ws.getRow(i).height = 28;
      }
      const titles = { combined: '照明・音響要望シート', count: 'セットリスト' };
      const label = xlsxFileLabel();
      saveWorkbook(wb, `${label ? label + '_' : ''}${titles[tab]}.xlsx`);
    }

    async function downloadStaffXlsx() {
      if (items.filter(i => i.type === 'song').length === 0) {
        alert('曲を追加してください。');
        return;
      }
      const d = currentSetzu();
      if (!d) {
        alert('会場を選択してください（セット図データが必要です）。');
        return;
      }
      const wb = new ExcelJS.Workbook();

      // ── シート1: セット情報（セルで描くセット図 ＋ 3表）──
      const ws = wb.addWorksheet('セット情報');
      const W = 8; // ステージ図のグリッド幅
      ws.columns = Array.from({ length: W }, () => ({ width: 13 }));
      let r = xlsxHeader(ws, true, W);
      r = xlsxSectionTitle(ws, r, W, `${d.venue} セット図`);

      const box = (row, col, text, opts = {}) => {
        const c = ws.getCell(row, col);
        c.value = text;
        c.alignment = XL.center;
        c.font = { size: opts.size || 10, bold: !!opts.bold, color: { argb: opts.color || 'FF666666' } };
        if (opts.fillArgb) c.fill = XL.fill(opts.fillArgb);
        c.border = opts.thickArgb
          ? { top: { style: 'thick', color: { argb: opts.thickArgb } }, left: { style: 'thick', color: { argb: opts.thickArgb } },
              bottom: { style: 'thick', color: { argb: opts.thickArgb } }, right: { style: 'thick', color: { argb: opts.thickArgb } } }
          : XL.border;
      };

      // ドラム（奥中央）＋マイク
      box(r, 4, 'Dr.');
      box(r, 5, '🎤');
      ws.getRow(r).height = 24;
      r++;

      // アンプ（VoBa → VoGt → Gt の順で均等配置・色付き）
      const order = u => (/VoBa/i.test(u) ? 0 : /VoGt/i.test(u) ? 1 : 2);
      const amps = [...d.amps].sort((a, b) => order(a.use) - order(b.use) || plainNum(a.num) - plainNum(b.num));
      const cols = amps.length === 1 ? [4]
        : amps.map((_, i) => Math.round(1 + (W - 1) * i / (amps.length - 1)));
      amps.forEach((a, i) => {
        box(r, cols[i], plainNum(a.num), { bold: true, size: 12, color: 'FFFFFFFF', fillArgb: 'FF111111', thickArgb: ampArgb(a.use) });
      });
      ws.getRow(r).height = 26;
      r += 2;

      // メンバー立ち位置
      box(r, 2, 'Vo.Ba.');
      box(r, 4, 'Vo.Gt.');
      box(r, 7, 'Gt.');
      ws.getRow(r).height = 24;
      r++;
      // ボーカルマイク
      box(r, 2, '🎤');
      box(r, 4, '🎤');
      r++;
      // 転がしモニター
      [1, 3, 5, 7].forEach(cl => box(r, cl, '▼MON'));
      r++;
      ws.mergeCells(r, 1, r, W);
      const floor = ws.getCell(r, 1);
      floor.value = 'フロア';
      floor.alignment = XL.center;
      floor.font = { size: 10, color: { argb: 'FF666666' } };
      r += 2;

      // アンプ表（用途セルに図と同じ色）
      r = xlsxSectionTitle(ws, r, W, 'アンプ');
      r = xlsxTable(ws, r, ['番号', '用途', '機種', 'レンタル/持込'],
        d.amps.map(a => [
          { v: a.num, bold: true },
          { v: a.use, bold: true, fill: ampArgb(a.use) },
          { v: a.model },
          { v: a.note },
        ]));
      r = xlsxSectionTitle(ws, r, W, '持ち込み機材');
      r = xlsxTable(ws, r, ['パート', '機材'],
        d.gear.map(g => [{ v: g.part, bold: true }, { v: g.text, align: 'left' }]));
      r = xlsxSectionTitle(ws, r, W, '初期返し要望');
      r = xlsxTable(ws, r, ['パート', '要望'],
        d.monitor.map(m => [{ v: m.part, bold: true }, { v: m.text, align: 'left' }]));

      // ── シート2: 照明・音響要望 ──
      writeCombinedSheet(wb.addWorksheet('照明・音響要望'), true);

      const label = xlsxFileLabel();
      saveWorkbook(wb, `${label ? label + '_' : ''}スタッフ用シート.xlsx`);
    }

    // ── Clear ────────────────────────────────────────────────────────────

    function clearAll() {
      if (items.length === 0) return;
      if (!confirm('リストをクリアしますか？')) return;
      items = [];
      renderList();
      document.getElementById('output-section').style.display = 'none';
    }
  </script>
