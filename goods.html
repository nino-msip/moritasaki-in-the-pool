<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merchandise — MoritaSaki in the pool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Merch catalog ── */
    .merch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
      margin: 32px 0 48px;
    }
    .merch-card {
      background: #fff;
      border: 1px solid var(--paper-line);
      cursor: pointer;
      text-align: left;
      padding: 0;
      display: flex;
      flex-direction: column;
      font: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .merch-card:hover {
      transform: translateY(-3px);
      box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.12);
    }
    .merch-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--paper-line);
    }
    .merch-card-info {
      padding: 12px 14px 14px;
    }
    .merch-card-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--black);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .merch-card-price {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 12px;
      color: var(--ink-dim-onwhite);
    }
    .merch-loading {
      color: var(--ink-dim-onwhite);
      font-size: 14px;
      margin: 24px 0;
    }

    /* Modal */
    .merch-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 13, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 200;
    }
    .merch-modal {
      background: #fff;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 640px) {
      .merch-modal { grid-template-columns: 1fr; }
    }
    .merch-modal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .merch-modal-body {
      padding: 28px;
      position: relative;
    }
    .merch-modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--paper);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      color: var(--black);
    }
    .merch-modal-title {
      font-family: 'Anton', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1.25;
      margin: 0 0 20px;
      padding-right: 30px;
    }
    .merch-modal-buy-label {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-dim-onwhite);
      margin-bottom: 10px;
    }
    .merch-modal-buy-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .merch-buy-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      text-decoration: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }
    .merch-buy-btn .price { font-weight: 400; opacity: 0.85; }
    .merch-buy-btn.bandcamp { background: #c8edf5; color: #0a5569; }
    .merch-buy-btn.base { background: #c6f1ea; color: #00534a; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-mark" href="index.html" aria-label="TOPへ戻る"><img src="logo.avif" alt="MoritaSaki in the pool" /></a>
    <a href="index.html">TOP</a>
    <a href="about.html">About</a>
    <a href="music.html">Music</a>
    <a href="mv.html">MV</a>
    <a href="schedule.html">Schedule</a>
    <a href="goods.html" class="active">Merchandise</a>
    <a href="others.html">Others</a>
    <span id="site-ver" class="site-ver"></span>
  </nav>

  <script>
    // ナビのアクティブなタブが横スクロールで隠れないよう表示範囲に入れる
    (function () {
      var active = document.querySelector('nav a.active');
      if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    })();
  </script>

  <!-- Goods -->
  <section id="goods">
    <h2>Merchandise</h2>

    <div class="music-links">
      <a href="https://mitp.base.shop" target="_blank"><img class="link-icon" src="icons/base.png" alt="" />BASE Official Shop</a>
      <a href="https://moritasaki.bandcamp.com/merch" target="_blank"><img class="link-icon" src="icons/bandcamp.svg" alt="" />Bandcamp Merch</a>
    </div>

    <p class="merch-loading" id="merch-loading">商品を読み込み中...</p>
    <div class="merch-grid" id="merch-grid"></div>

    <div class="page-nav">
      <a href="schedule.html">← Schedule</a>
      <a href="others.html">Others →</a>
    </div>
  </section>

<script>
  // ── マーチカタログ（BASE/Bandcampの公開ページから事前に取得・保存した
  //    データを読み込んで表示する。ライブ連携ではなく静的データ） ──
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let MERCH = [];

  function openMerchModal(item) {
    const backdrop = document.createElement('div');
    backdrop.className = 'merch-modal-backdrop';
    const buyButtons = [];
    if (item.bandcamp) {
      buyButtons.push(`<a class="merch-buy-btn bandcamp" href="${esc(item.bandcamp.url)}" target="_blank" rel="noopener">
        <span>Bandcampで購入</span>${item.bandcamp.price ? `<span class="price">${esc(item.bandcamp.price)}</span>` : ''}
      </a>`);
    }
    if (item.base) {
      buyButtons.push(`<a class="merch-buy-btn base" href="${esc(item.base.url)}" target="_blank" rel="noopener">
        <span>BASEで購入</span>${item.base.price ? `<span class="price">${esc(item.base.price)}</span>` : ''}
      </a>`);
    }
    backdrop.innerHTML = `
      <div class="merch-modal" role="dialog" aria-modal="true">
        <img src="${esc(item.image)}" alt="" />
        <div class="merch-modal-body">
          <button class="merch-modal-close" aria-label="閉じる">×</button>
          <h3 class="merch-modal-title">${esc(item.title)}</h3>
          <div class="merch-modal-buy-label">購入先を選択</div>
          <div class="merch-modal-buy-row">${buyButtons.join('')}</div>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    document.body.style.overflow = 'hidden';

    function close() {
      backdrop.remove();
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
    backdrop.querySelector('.merch-modal-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
  }

  function renderMerchGrid(items) {
    const grid = document.getElementById('merch-grid');
    grid.innerHTML = items.map((item, i) => `
      <button class="merch-card" type="button" data-idx="${i}">
        <img src="${esc(item.image)}" alt="" loading="lazy" />
        <div class="merch-card-info">
          <div class="merch-card-title">${esc(item.title)}</div>
          <div class="merch-card-price">${esc(item.base ? item.base.price : (item.bandcamp ? item.bandcamp.price : ''))}</div>
        </div>
      </button>`).join('');
    grid.querySelectorAll('.merch-card').forEach(card => {
      card.addEventListener('click', () => openMerchModal(items[+card.dataset.idx]));
    });
  }

  async function loadMerch() {
    const loading = document.getElementById('merch-loading');
    try {
      const res = await fetch('merch-catalog.json');
      MERCH = await res.json();
      loading.remove();
      renderMerchGrid(MERCH);
    } catch {
      loading.textContent = '商品情報の読み込みに失敗しました。';
    }
  }
  loadMerch();

  // ── サイトバージョン（最新コミット日時から自動生成）──
  async function loadVersion() {
    try {
      const res = await fetch('https://api.github.com/repos/nino-msip/moritasaki-in-the-pool/commits/main');
      if (!res.ok) return;
      const data = await res.json();
      const d = new Date(data.commit.committer.date);
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('site-ver').textContent =
        `ver ${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}.${pad(d.getHours())}${pad(d.getMinutes())}`;
    } catch {}
  }
  loadVersion();
</script>
</body>
</html>
