<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule — MoritaSaki in the pool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Schedule: Pattern A の一覧デザイン（このページのみ）── */
    .show-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: clamp(20px, 3vw, 32px);
      margin-bottom: 48px;
    }
    .show-card { display: flex; flex-direction: column; }
    .show-plate {
      background: #fff;
      color: var(--black);
      aspect-ratio: 4 / 3;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--paper-line);
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    a.show-plate:hover { transform: translateY(-3px); }
    .show-plate::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      background: var(--red);
    }
    .show-plate.has-flyer { padding: 0; }
    .show-flyer-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .show-plate-scrim {
      position: relative;
      z-index: 1;
      padding: 16px 18px 20px;
      background: linear-gradient(to top, rgba(13,13,13,0.85), rgba(13,13,13,0));
    }
    .show-plate.has-flyer .show-plate-title { color: #fff; }
    .show-plate-title {
      font-family: 'Anton', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: clamp(18px, 2.2vw, 22px);
      line-height: 1.2;
    }
    .show-meta {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .show-date {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--red);
    }
    .show-venue { font-size: 13px; color: var(--black); }
    .show-city { color: var(--ink-dim-onwhite); }
    .show-performers, .show-notes {
      font-size: 12px;
      color: var(--ink-dim-onwhite);
      margin-top: 2px;
    }
    .show-tickets { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .ticket-pill {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--black);
      border: 1px solid var(--paper-line);
      padding: 7px 15px;
      text-decoration: none;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .ticket-pill:hover { border-color: var(--red); color: var(--red); }
    .show-tba { font-size: 12px; color: #999; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-mark" href="index.html" aria-label="TOPへ戻る"><img src="logo.avif" alt="MoritaSaki in the pool" /></a>
    <a href="index.html">TOP</a>
    <a href="about.html">About</a>
    <a href="music.html">Music</a>
    <a href="mv.html">MV</a>
    <a href="schedule.html" class="active">Schedule</a>
    <a href="goods.html">Merchandise</a>
    <a href="others.html">Others</a>
    <span id="site-ver" class="site-ver"></span>
  </nav>

  <script>
    // ナビのアクティブなタブが横スクロールで隠れないよう表示範囲に入れる
    (function () {
      var active = document.querySelector('nav a.active');
      if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    })();
  </script>

  <!-- Live Schedule -->
  <section id="schedule">
    <h2>Live Schedule</h2>

    <div id="live-list" class="live-list">
      <p class="live-loading">Loading...</p>
    </div>

    <div class="page-nav">
      <a href="mv.html">← MV</a>
      <a href="goods.html">Merchandise →</a>
    </div>
  </section>

<script>
  const BIT_APP_ID = '59eb73f72056941927ca5a752b0891de';
  const BIT_ARTIST = 'MoritaSaki in the pool';

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  window.__flyerFallback = function (img) {
    const exts = (img.dataset.exts || '').split(',').filter(Boolean);
    if (exts.length) {
      const next = exts.shift();
      img.dataset.exts = exts.join(',');
      img.src = img.dataset.base + '.' + next;
    } else {
      const plate = img.closest('.show-plate');
      if (plate) plate.classList.remove('has-flyer');
      img.remove();
    }
  };

  function parseBitDate(s) {
    if (!s) return null;
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }

  function formatDateJa(d) {
    if (!d) return '';
    const wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}（${wd}）`;
  }

  function vendorLabel(name) {
    if (!name) return 'Ticket';
    const n = name.toLowerCase();
    if (n.includes('livepocket')) return 'LivePocket';
    if (n.includes('zaiko'))     return 'Zaiko';
    if (n.includes('eplus') || n.includes('e+')) return 'イープラス';
    if (n.includes('tiget'))     return 'Tiget';
    if (n.includes('tixplus'))   return 'TixPlus';
    if (n.includes('peatix'))    return 'Peatix';
    return 'Ticket';
  }

  function renderEvent(e) {
    const d = parseBitDate(e.starts_at || e.datetime);
    const date = esc(formatDateJa(d));

    const title = esc(e.title || '');
    const city = esc(e.venue?.city || e.venue?.location || '');

    const performers = (e.lineup || [])
      .filter(n => n !== BIT_ARTIST)
      .map(esc)
      .join(', ');

    const tickets = (e.offers || []).map(o =>
      `<a href="${esc(o.url)}" target="_blank" rel="noopener" class="ticket-pill">${esc(vendorLabel(o.vendor_name))}</a>`
    );
    const primaryTicketUrl = e.offers?.[0]?.url || null;

    // flyers/YYYY-MM-DD.* を日付から探す
    const flyerBase = d
      ? `flyers/${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
      : null;
    const flyerImg = flyerBase
      ? `<img class="show-flyer-bg" src="${flyerBase}.jpg" data-base="${flyerBase}" data-exts="jpeg,png,webp" onerror="window.__flyerFallback(this)" alt="" loading="lazy" />`
      : '';

    const plateInner = flyerImg
      ? `${flyerImg}<div class="show-plate-scrim"><span class="show-plate-title">${title || '(タイトル未定)'}</span></div>`
      : `<span class="show-plate-title">${title || '(タイトル未定)'}</span>`;
    const plateClass = flyerImg ? ' has-flyer' : '';
    const plate = primaryTicketUrl
      ? `<a class="show-plate${plateClass}" href="${esc(primaryTicketUrl)}" target="_blank" rel="noopener">${plateInner}</a>`
      : `<div class="show-plate${plateClass}">${plateInner}</div>`;

    return `
      <article class="show-card">
        ${plate}
        <div class="show-meta">
          <span class="show-date">${date}</span>
          <span class="show-venue">${city}</span>
          ${performers ? `<span class="show-performers">w/ ${performers}</span>` : ''}
        </div>
        <div class="show-tickets">
          ${tickets.length ? tickets.join('') : '<span class="show-tba">準備中</span>'}
        </div>
      </article>`;
  }

  async function loadLiveSchedule() {
    const container = document.getElementById('live-list');
    try {
      const url = `https://rest.bandsintown.com/artists/${encodeURIComponent(BIT_ARTIST)}/events?app_id=${BIT_APP_ID}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('fetch failed');
      const events = await res.json();
      if (!Array.isArray(events) || !events.length) {
        container.innerHTML = '<p class="live-empty">現在ライブの予定はありません。</p>';
        return;
      }
      container.innerHTML = `<div class="show-grid">${events.map(renderEvent).join('')}</div>`;
    } catch {
      container.innerHTML = '<p class="live-empty">ライブ情報の取得に失敗しました。</p>';
    }
  }

  loadLiveSchedule();

  // ── サイトバージョン（最新コミット日時から自動生成）──
  async function loadVersion() {
    try {
      const res = await fetch('https://api.github.com/repos/nino-msip/moritasaki-in-the-pool/commits/main');
      if (!res.ok) return;
      const data = await res.json();
      const d = new Date(data.commit.committer.date);
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('site-ver').textContent =
        `ver ${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}.${pad(d.getHours())}${pad(d.getMinutes())}`;
    } catch {}
  }
  loadVersion();
</script>
</body>
</html>
