name: Sync Schedule Flyers

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-flyers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Fetch flyer images from Google Drive
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: python3 scripts/sync_flyers.py

      - name: Commit and push if changed
        run: |
          git config user.name "flyer-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add flyers
          if ! git diff --cached --quiet; then
            git commit -m "Sync schedule flyers from Google Drive [automated]"
            git pull --rebase origin main
            git push
          else
            echo "No flyer changes."
          fi
